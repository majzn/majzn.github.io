<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Projects</title>
  <meta name="description" content="A searchable homepage for HTML projects." />

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: #121722;
      --panel-hover: #171d29;
      --text: #f4f7fb;
      --muted: #9aa6b5;
      --border: rgba(255,255,255,.09);
      --accent: #8ea2ff;
      --danger: #ff9b9b;
      --shadow: 0 18px 50px rgba(0,0,0,.28);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(73,100,255,.13), transparent 28rem),
        radial-gradient(circle at 90% 10%, rgba(159,82,255,.10), transparent 28rem),
        var(--bg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4rem);
      line-height: .95;
      letter-spacing: -.055em;
    }

    .subtitle {
      margin: 14px 0 0;
      color: var(--muted);
    }

    .count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: .9rem;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 0;
      margin-bottom: 18px;
      backdrop-filter: blur(18px);
      background: linear-gradient(
        to bottom,
        rgba(11,13,18,.94),
        rgba(11,13,18,.73),
        transparent
      );
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(18,23,34,.92);
      box-shadow: var(--shadow);
    }

    .search svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--muted);
    }

    .search input {
      width: 100%;
      padding: 14px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    .search input::placeholder {
      color: #748091;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--panel-hover);
      border-color: rgba(255,255,255,.17);
    }

    .preview {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(135deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    }

    .preview iframe {
      position: absolute;
      inset: 0;
      width: 1280px;
      height: 800px;
      border: 0;
      background: white;
      transform: scale(.25);
      transform-origin: top left;
      pointer-events: none;
    }

    .preview-status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 16px 16px;
    }

    .project-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 720;
      letter-spacing: -.01em;
    }

    .open-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--muted);
    }

    .state {
      grid-column: 1 / -1;
      padding: 30px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      line-height: 1.65;
    }

    .state strong {
      color: var(--text);
    }

    .state.error {
      border-color: rgba(255,155,155,.25);
    }

    .state code {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      color: #dbe2ff;
      background: rgba(255,255,255,.06);
    }

    .state a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 20px, 1200px);
        padding-top: 30px;
      }

      header {
        align-items: start;
        flex-direction: column;
        gap: 10px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <header>
      <div>
        <h1>My Projects</h1>
        <p class="subtitle">Browse, search, and open any project.</p>
      </div>
      <div class="count" id="count">Loading projects…</div>
    </header>

    <div class="toolbar">
      <label class="search" aria-label="Search projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>

        <input
          id="search"
          type="search"
          placeholder="Search projects…"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
    </div>

    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <script>
    /*
      ============================================================
      OPTIONAL CONFIGURATION
      ============================================================

      If your site is hosted at a normal GitHub Pages URL like:

          https://YOUR-NAME.github.io/YOUR-REPO/

      you can leave OWNER and REPO blank. They will be detected.

      If you use a CUSTOM DOMAIN, fill these in:

          OWNER: "your-github-username",
          REPO: "your-repository-name"

      PROJECTS_PATH is the path INSIDE the GitHub repository.
    */
    const CONFIG = {
      OWNER: "",
      REPO: "",
      PROJECTS_PATH: "projects"
    };

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("search");
    const countEl = document.getElementById("count");

    let allProjects = [];

    function displayName(fileName) {
      return fileName
        .replace(/\.html?$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function detectGitHubRepository() {
      if (CONFIG.OWNER && CONFIG.REPO) {
        return {
          owner: CONFIG.OWNER,
          repo: CONFIG.REPO
        };
      }

      const host = location.hostname.toLowerCase();

      if (!host.endsWith(".github.io")) {
        throw new Error(
          "This is not a github.io URL. Set CONFIG.OWNER and CONFIG.REPO in index.html."
        );
      }

      const owner = host.slice(0, -".github.io".length);
      const segments = location.pathname
        .split("/")
        .filter(Boolean)
        .map(decodeURIComponent);

      /*
        Project site:
          https://name.github.io/repository/
          => repo = first path segment

        User/organization site:
          https://name.github.io/
          => repo = name.github.io
      */
      const repo = segments.length > 0
        ? segments[0]
        : `${owner}.github.io`;

      return { owner, repo };
    }

    function projectPublicUrl(fileName) {
      /*
        Relative URL is intentional:
        - /repo/index.html -> /repo/projects/file.html
        - /index.html      -> /projects/file.html
      */
      return new URL(
        `./${CONFIG.PROJECTS_PATH}/${encodeURIComponent(fileName)}`,
        location.href
      ).href;
    }

    function createCard(project) {
      const link = document.createElement("a");
      link.className = "card";
      link.href = project.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.title = `Open ${project.name} in a new tab`;

      const preview = document.createElement("div");
      preview.className = "preview";

      const previewStatus = document.createElement("div");
      previewStatus.className = "preview-status";
      previewStatus.textContent = "Loading preview…";

      const iframe = document.createElement("iframe");
      iframe.src = project.url;
      iframe.loading = "lazy";
      iframe.tabIndex = -1;
      iframe.setAttribute("aria-hidden", "true");

      iframe.addEventListener("load", () => {
        previewStatus.remove();
      });

      iframe.addEventListener("error", () => {
        previewStatus.textContent = "Preview unavailable";
        iframe.remove();
      });

      preview.append(previewStatus, iframe);

      const meta = document.createElement("div");
      meta.className = "meta";

      const name = document.createElement("div");
      name.className = "project-name";
      name.textContent = project.name;

      const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      icon.setAttribute("viewBox", "0 0 24 24");
      icon.setAttribute("fill", "none");
      icon.setAttribute("stroke", "currentColor");
      icon.setAttribute("stroke-width", "2");
      icon.setAttribute("class", "open-icon");
      icon.setAttribute("aria-hidden", "true");
      icon.innerHTML = `
        <path d="M14 3h7v7"></path>
        <path d="M10 14 21 3"></path>
        <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path>
      `;

      meta.append(name, icon);
      link.append(preview, meta);

      return link;
    }

    function render(projects) {
      grid.innerHTML = "";

      if (!projects.length) {
        const empty = document.createElement("div");
        empty.className = "state";
        empty.textContent = "No matching projects found.";
        grid.append(empty);
      } else {
        const fragment = document.createDocumentFragment();

        for (const project of projects) {
          fragment.append(createCard(project));
        }

        grid.append(fragment);
      }

      countEl.textContent =
        `${projects.length} project${projects.length === 1 ? "" : "s"}`;
    }

    function filterProjects() {
      const query = searchInput.value.trim().toLowerCase();

      if (!query) {
        render(allProjects);
        return;
      }

      render(
        allProjects.filter(project =>
          project.name.toLowerCase().includes(query) ||
          project.file.toLowerCase().includes(query)
        )
      );
    }

    async function githubFetch(url) {
      const response = await fetch(url, {
        headers: {
          Accept: "application/vnd.github+json"
        },
        cache: "no-store"
      });

      if (!response.ok) {
        let message = `${response.status} ${response.statusText}`;

        try {
          const data = await response.json();
          if (data && data.message) {
            message += ` — ${data.message}`;
          }
        } catch (_) {}

        throw new Error(message);
      }

      return response.json();
    }

    async function loadProjects() {
      const { owner, repo } = detectGitHubRepository();

      const repoData = await githubFetch(
        `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`
      );

      const branch = repoData.default_branch;

      const encodedPath = CONFIG.PROJECTS_PATH
        .split("/")
        .filter(Boolean)
        .map(encodeURIComponent)
        .join("/");

      const contentsUrl =
        `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}` +
        `/contents/${encodedPath}?ref=${encodeURIComponent(branch)}`;

      const contents = await githubFetch(contentsUrl);

      if (!Array.isArray(contents)) {
        throw new Error(
          `"${CONFIG.PROJECTS_PATH}" was not returned as a directory.`
        );
      }

      return contents
        .filter(item =>
          item.type === "file" &&
          /\.html?$/i.test(item.name)
        )
        .map(item => ({
          file: item.name,
          name: displayName(item.name),
          url: projectPublicUrl(item.name)
        }))
        .sort((a, b) =>
          a.name.localeCompare(b.name, undefined, {
            numeric: true,
            sensitivity: "base"
          })
        );
    }

    function showError(error) {
      console.error(error);

      countEl.textContent = "Could not load projects";

      const state = document.createElement("div");
      state.className = "state error";

      const strong = document.createElement("strong");
      strong.textContent = "Could not read the projects folder.";

      const details = document.createElement("div");
      details.style.marginTop = "12px";
      details.textContent = error.message || String(error);

      const help = document.createElement("div");
      help.style.marginTop = "18px";
      help.innerHTML = `
        Make sure the repository is public and contains
        <code>${CONFIG.PROJECTS_PATH}/</code>.
        <br>
        If you use a custom domain, set
        <code>CONFIG.OWNER</code> and <code>CONFIG.REPO</code>
        near the top of the script.
      `;

      state.append(strong, details, help);
      grid.replaceChildren(state);
    }

    async function init() {
      try {
        allProjects = await loadProjects();

        if (!allProjects.length) {
          countEl.textContent = "0 projects";

          const empty = document.createElement("div");
          empty.className = "state";
          empty.innerHTML = `
            <strong>No HTML files found.</strong>
            <br><br>
            Put your project files inside
            <code>${CONFIG.PROJECTS_PATH}/</code>
            in the repository.
          `;

          grid.replaceChildren(empty);
          return;
        }

        render(allProjects);
      } catch (error) {
        showError(error);
      }
    }

    searchInput.addEventListener("input", filterProjects);
    init();
  </script>
</body>
</html>
