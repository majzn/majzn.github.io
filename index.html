<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/><meta name="polyform-build" content="piano-curves-20260913"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="An offline, recursive modular music workstation" name="description"/>
  <title>
   POLYFORM — Open workspace
  </title>
  <style>
   
:root {
  color-scheme: dark;
  --bg: #151719;
  --panel: #1c1f22;
  --raised: #25292d;
  --line: #34393e;
  --text: #e0e5e7;
  --muted: #98a2aa;
  --accent: #aadab8;
  --orange: #e6b879;
  --blue: #86bde0;
  --pink: #d09ecb;
  --red: #ed8982;
  font: 14px system-ui,sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

button,
input,
select {
  font: inherit;
  color: inherit;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: var(--radius,4px);
  transition: background .12s,border-color .12s,color .12s,opacity .12s;
}

button {
  padding: 5px 9px;
  cursor: pointer;
  white-space: nowrap;
}

button:hover {
  background: var(--hover);
}

button.on {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--active-text);
}

button:disabled {
  opacity: .4;
  cursor: default;
}

input,
select {
  padding: 5px;
  min-width: 0;
}

input[type=number] {
  width: 72px;
}

input[type=range] {
  padding: 0;
  accent-color: var(--accent);
  width: 100%;
}

input[type=checkbox] {
  accent-color: var(--accent);
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

header {
  height: 56px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.brand {
  font-size: 14px;
  letter-spacing: 2px;
  font-weight: 650;
  margin-right: 10px;
}

.sep {
  height: 24px;
  width: 1px;
  background: var(--line);
  margin: 0 4px;
}

.grow {
  flex: 1;
}

.sub {
  font-size: 12px;
  color: var(--muted);
}

#clock {
  font: 18px ui-monospace,monospace;
  min-width: 110px;
  text-align: center;
  color: var(--accent);
}

#projectName {
  background: transparent;
  border: 0;
  width: min(260px,21vw);
  min-width: 120px;
  font-weight: 600;
  text-overflow: ellipsis;
}

#app {
  height: calc(100vh - 134px);
  display: grid;
  grid-template-columns: 210px minmax(320px,1fr) 276px;
}

aside {
  background: var(--panel);
  overflow: auto;
  scrollbar-gutter: stable;
}

#browser {
  border-right: 1px solid var(--line);
  padding: 12px 9px;
}

#inspector {
  border-left: 1px solid var(--line);
  padding: 14px 12px;
}

main {
  min-width: 0;
  min-height: 0;
  display: grid;
  --graph-pane-height: 46%;
  grid-template-rows: minmax(120px,var(--graph-pane-height)) 7px var(--editor-tabs-height,43px) minmax(92px,1fr);
  grid-template-areas:
    "graph"
    "splitter"
    "tabs"
    "editor";
  position: relative;
  overflow: hidden;
}

nav {
  grid-area: tabs;
  height: var(--editor-tabs-height,43px);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-bottom: 1px solid var(--line);
  border-top: 1px solid var(--line);
  min-width: 0;
}

#workspaceSplitter {
  grid-area: splitter;
  position: relative;
  z-index: 12;
  cursor: row-resize;
  touch-action: none;
  background: var(--canvas-deep);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

#workspaceSplitter:after {
  content: "";
  position: absolute;
  left: 50%;
  top: 2px;
  width: 54px;
  height: 2px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: color-mix(in srgb,var(--muted) 55%,transparent);
}

#workspaceSplitter:hover:after,
#workspaceSplitter.dragging:after {
  background: var(--accent);
}

nav button {
  border-color: transparent;
  background: transparent;
}

nav button.on {
  background: var(--raised);
  border-color: var(--line);
  color: var(--accent);
}

.toolbar {
  height: 44px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}

.toolbar select {
  max-width: 150px;
}

.toolbar label {
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  color: var(--muted);
  font-size: 12px;
}

.view {
  grid-area: editor;
  display: none;
  min-height: 0;
  min-width: 0;
  position: relative;
  flex-direction: column;
  overflow: hidden;
}

.view.active {
  display: flex;
}

#graphView {
  grid-area: graph;
  display: flex !important;
  min-height: 0;
  min-width: 0;
  border-bottom: 0;
}

main.graph-focus #graphView {
  box-shadow: inset 0 0 0 1px color-mix(in srgb,var(--accent) 52%,transparent);
}

main.editor-focus > nav {
  box-shadow: inset 0 1px 0 color-mix(in srgb,var(--accent) 42%,transparent);
}

.viewport {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: var(--canvas);
}

.viewport canvas {
  position: absolute;
  inset: 0;
  z-index: 2;
  touch-action: none;
}

.scroller {
  position: absolute;
  inset: 0;
  overflow: scroll;
  z-index: 1;
  pointer-events: auto;
}

.scroller::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}

.scroller::-webkit-scrollbar-thumb {
  background: var(--line);
  border: 3px solid var(--canvas-deep);
  border-radius: 6px;
}

.scroller::-webkit-scrollbar-track {
  background: var(--canvas-deep);
}

.extent {
  pointer-events: none;
}

.section {
  margin: 18px 0 8px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.section:first-child {
  margin-top: 0;
}

.item {
  padding: 7px 8px;
  border: 1px solid transparent;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  gap: 8px;
  align-items: center;
}

.item:hover {
  background: var(--raised);
}

.item.selected {
  border-color: var(--accent);
  background: var(--selected);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  flex-shrink: 0;
}

.item .sub {
  margin-left: auto;
}

.row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 9px 0;
}

.row label {
  flex: 1;
  color: var(--muted);
  min-width: 70px;
}

.row input:not([type=checkbox]),
.row select {
  width: 115px;
}

.row input[type=range] {
  width: 110px;
}

.row.wide {
  flex-wrap: wrap;
}

.row.wide input {
  width: 100%;
}

.control {
  margin: 10px 0;
}

.control-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
}

.control-head label {
  flex: 1;
  min-width: 0;
  color: var(--muted);
  font-size: 13px;
}

.control-body {
  display: grid;
  grid-template-columns: minmax(0,1fr) 70px;
  gap: 7px;
  align-items: center;
}

.control-body input[type=range] {
  width: 100%;
  min-width: 0;
}

.control-body input[type=number] {
  width: 70px;
  font: 12px ui-monospace,monospace;
  text-align: right;
}

.control.bipolar .control-body {
  position: relative;
}

.control.bipolar .control-body:before {
  content: "";
  position: absolute;
  left: calc((100% - 77px)/2);
  top: 4px;
  bottom: 4px;
  width: 1px;
  background: color-mix(in srgb,var(--line) 72%,transparent);
  pointer-events: none;
}

.segmented {
  display: flex;
  gap: 3px;
  flex-wrap: wrap;
}

.segmented button {
  flex: 1 1 auto;
  padding: 5px 7px;
  font-size: 12px;
  min-width: 42px;
}

.segmented button.on {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--active-text);
}

.segment-select {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

.groove-step {
  display: grid;
  grid-template-columns: 24px minmax(0,1fr) 58px;
  gap: 6px;
  align-items: center;
  margin: 5px 0;
}

.groove-step>span {
  font: 11px ui-monospace,monospace;
  color: var(--muted);
  text-align: right;
}

.groove-step input[type=range] {
  width: 100%;
  min-width: 0;
}

.groove-step input[type=number] {
  width: 58px;
  font: 11px ui-monospace,monospace;
  text-align: right;
}

.stepper-body {
  display: grid;
  grid-template-columns: 31px minmax(0,1fr) 31px;
  gap: 5px;
  align-items: center;
}

.stepper-body button {
  padding: 4px 0;
  font-size: 16px;
  line-height: 1;
}

.stepper-body input[type=number] {
  width: 100%;
  text-align: center;
  font: 12px ui-monospace,monospace;
}

.quick-values {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 5px;
}

.quick-values button {
  padding: 3px 6px;
  font-size: 10px;
  color: var(--muted);
}

.quick-values button.on {
  color: var(--on-accent);
  background: var(--accent-soft);
  border-color: var(--accent);
}

.control.discrete .control-head label:after {
  content: " · exact";
  font-size: 10px;
  opacity: .55;
  font-weight: 400;
}

input[type=checkbox] {
  appearance: none;
  -webkit-appearance: none;
  width: 34px;
  height: 19px;
  padding: 0;
  border-radius: 999px;
  background: var(--raised);
  border: 1px solid var(--line);
  position: relative;
  cursor: pointer;
  transition: background .12s,border-color .12s;
  flex: none;
}

input[type=checkbox]:before {
  content: "";
  position: absolute;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  left: 2px;
  top: 2px;
  background: var(--muted);
  transition: transform .12s,background .12s;
}

input[type=checkbox]:checked {
  background: var(--accent-soft);
  border-color: var(--accent);
}

input[type=checkbox]:checked:before {
  transform: translateX(15px);
  background: var(--active-text);
}

input[type=checkbox]:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

h3 {
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 15px;
}

.helptext {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
}

.tag {
  font: 12px ui-monospace,monospace;
  color: var(--muted);
}

#nodeSearch,
#assetSearch {
  width: 100%;
  margin-bottom: 8px;
}

.palette-node {
  padding: 6px 8px 6px 25px;
  cursor: grab;
  font-size: 13px;
  border-radius: var(--radius,4px);
}

.palette-node:hover {
  background: var(--raised);
}

.tree-section {
  margin: 3px 0;
}

.tree-header {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 7px;
  border: 0;
  background: transparent;
  color: var(--muted);
  text-align: left;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: .055em;
  text-transform: uppercase;
}

.tree-header:hover {
  background: var(--raised);
  color: var(--text);
}

.tree-chevron {
  width: 12px;
  display: inline-block;
  flex: none;
  text-align: center;
  font-size: 10px;
  transition: transform .12s;
}

.tree-header[aria-expanded="false"] .tree-chevron {
  transform: rotate(-90deg);
}

.tree-children {
  display: block;
}

.tree-section.collapsed>.tree-children {
  display: none;
}

.tree-nested {
  margin-left: 11px;
  border-left: 1px solid var(--line);
  padding-left: 4px;
}

.asset-row {
  display: flex;
  align-items: center;
  gap: 4px;
}

.asset-row>.item {
  flex: 1;
  min-width: 0;
}

.asset-expander {
  width: 21px;
  height: 25px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  flex: none;
}

.asset-expander:hover {
  background: var(--raised);
  color: var(--text);
}

.asset-preset {
  display: flex;
  gap: 7px;
  align-items: center;
  padding: 5px 7px 5px 16px;
  cursor: pointer;
  border-radius: var(--radius,4px);
  font-size: 12px;
}

.asset-preset:hover {
  background: var(--raised);
}

.asset-preset .tag {
  font-size: 10px;
  flex: none;
}

#graphView .viewport {
  background: var(--canvas);
}

#graphVizCanvas {
  z-index: 1;
  pointer-events: none;
}

#graphCanvas {
  z-index: 2;
  background: transparent;
}

#crumb {
  display: flex;
  gap: 4px;
  align-items: center;
  flex: 1;
  overflow: auto;
}

.velocity {
  height: 112px;
  position: relative;
  border-top: 1px solid var(--line);
  background: var(--canvas);
}

.velocity canvas {
  width: 100%;
  height: 100%;
  touch-action: none;
}

.mixgrid {
  display: flex;
  gap: 8px;
  padding: 18px;
  overflow: auto;
  flex: 1;
  align-items: stretch;
}

.strip {
  width: 120px;
  flex-shrink: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 3px solid var(--accent);
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.strip strong {
  font-size: 14px;
  cursor: pointer;
}

.faderrow {
  display: flex;
  flex: 1;
  min-height: 150px;
  gap: 12px;
}

.faderrow input {
  writing-mode: vertical-lr;
  direction: rtl;
  width: 28px;
}

.meter {
  background: var(--canvas-deep);
  width: 9px;
  height: 100%;
  position: relative;
  overflow: hidden;
}

.meter i {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 0;
  background: linear-gradient(to top,var(--accent) 0%,var(--orange) 85%,var(--danger) 99%);
}

dialog {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: calc(var(--radius,4px) + 4px);
  max-width: min(740px,94vw);
  padding: 22px;
  max-height: 85vh;
  overflow: auto;
  box-shadow: var(--shadow-dialog,0 24px 90px #0009);
}

dialog::backdrop {
  background: #0008;
}

.dialogbar {
  display: flex;
  align-items: center;
  margin-bottom: 16px;
}

.dialogbar h3 {
  margin: 0;
  flex: 1;
}

#dialogBody table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}

td,
th {
  text-align: left;
  padding: 8px;
  border-bottom: 1px solid var(--line);
}

kbd {
  font: 12px ui-monospace,monospace;
  background: var(--raised);
  border: 1px solid var(--line);
  padding: 3px 5px;
  border-radius: 3px;
}

.menupop {
  position: fixed;
  z-index: 50;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-ui,0 12px 35px #0008);
  border-radius: calc(var(--radius,4px) + 1px);
  min-width: 220px;
  padding: 5px;
}

.menupop button {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  padding: 8px;
}

.menupop button:hover {
  background: var(--hover);
}

.menupop hr {
  border: 0;
  border-top: 1px solid var(--line);
}

.slider-config-menu {
  min-width: 286px;
  padding: 9px;
}

.slider-config-menu .slider-config-title {
  font-weight: 650;
  margin: 1px 2px 8px;
}

.slider-config-grid {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 7px;
  align-items: center;
}

.slider-config-grid label {
  font-size: 12px;
  color: var(--muted);
}

.slider-config-grid input,
.slider-config-grid select {
  width: 100%;
}

.slider-config-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.slider-config-actions button {
  flex: 1;
  justify-content: center;
}

input[type=range].slider-custom {
  outline: 1px solid color-mix(in srgb,var(--accent) 42%,transparent);
  outline-offset: 2px;
}

#toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--raised);
  color: var(--control-text);
  border: 1px solid var(--accent);
  padding: 10px 18px;
  border-radius: calc(var(--radius,4px) + 1px);
  box-shadow: var(--shadow-ui);
  z-index: 100;
  display: none;
  max-width: 80vw;
}

.stepgrid {
  display: grid;
  grid-template-columns: repeat(16,1fr);
  gap: 4px;
  margin: 15px 0;
}

.stepgrid button {
  height: 32px;
  padding: 0;
}

.stepgrid button:nth-child(8n+1),
.stepgrid button:nth-child(8n+2),
.stepgrid button:nth-child(8n+3),
.stepgrid button:nth-child(8n+4) {
  background: var(--raised);
}

.stepgrid button.on {
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent);
}

.drum-editor {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 14px 12px 26px;
  background: var(--canvas);
}

.drum-pattern {
  --drum-steps: 16;
  min-width: max(760px, calc(212px + var(--drum-steps) * 32px));
}

.drum-row {
  display: grid;
  grid-template-columns: 200px repeat(var(--drum-steps), minmax(27px, 1fr));
  gap: 4px;
  align-items: center;
  margin-bottom: 4px;
}

.drum-row.header {
  position: sticky;
  top: 0;
  z-index: 4;
  padding: 4px 0 6px;
  background: var(--canvas);
  border-bottom: 1px solid var(--line);
}

.drum-row-meta {
  position: sticky;
  left: 0;
  z-index: 3;
  display: grid;
  grid-template-columns: 26px minmax(72px,1fr) 54px 26px;
  gap: 4px;
  align-items: center;
  min-height: 30px;
  padding-right: 4px;
  background: var(--canvas);
}

.drum-row.header .drum-row-meta {
  z-index: 5;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .05em;
  text-transform: uppercase;
}

.drum-row-meta input {
  width: 100%;
  min-width: 0;
  padding: 4px 5px;
  font-size: 12px;
}

.drum-row-meta button {
  padding: 3px 0;
  min-width: 0;
}

.drum-lane-select {
  width: 100%;
  min-width: 0;
  height: 26px;
  padding: 0 !important;
  display: grid;
  place-items: center;
  font: 11px ui-monospace,monospace;
  color: var(--muted);
  background: color-mix(in srgb,var(--raised) 72%,var(--canvas));
}
.drum-lane-select.on {
  color: var(--on-accent);
  background: var(--accent);
  border-color: var(--accent);
}
.drum-source-editor { display:grid; grid-template-columns:auto minmax(120px,1fr) auto; gap:4px; align-items:center; margin-top:4px; }
.drum-source-editor > label { font-size:9px; color:var(--muted); }
.drum-source-editor select, .drum-source-editor input { width:100%; min-width:0; }
.drum-source-detail { display:grid; grid-template-columns:repeat(3,minmax(90px,1fr)); gap:5px; align-items:end; }
.drum-source-detail label { display:grid; gap:2px; min-width:0; font-size:9px; color:var(--muted); }
.drum-source-detail select, .drum-source-detail input { width:100%; min-width:0; }
.drum-pad-routing-note { font-size:9px; color:var(--muted); line-height:1.25; margin-top:4px; }
main.editor-tight .drum-source-detail { grid-template-columns:repeat(3,minmax(72px,1fr)); }
main.editor-micro .drum-source-editor > label, main.editor-micro .drum-pad-routing-note { display:none; }
main.editor-micro .drum-lane-select { height: 18px; font-size: 9px; }

.drum-step,
.drum-step-label {
  min-width: 27px;
  height: 30px;
  padding: 0;
  text-align: center;
  font: 10px ui-monospace,monospace;
}

.drum-step {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: color-mix(in srgb,var(--raised) 88%,var(--canvas));
}

.drum-step::before {
  content: "";
  position: absolute;
  z-index: 1;
  top: 4px;
  bottom: 4px;
  left: 50%;
  width: 1px;
  background: color-mix(in srgb,var(--muted) 22%,transparent);
  pointer-events: none;
}

.drum-vel-fill {
  position: absolute;
  z-index: 0;
  left: 2px;
  right: 2px;
  bottom: 2px;
  height: var(--drum-vel-height,0%);
  min-height: 0;
  border-radius: max(1px,calc(var(--radius) - 2px));
  background: color-mix(in srgb,var(--accent) 88%,var(--raised));
  opacity: .92;
  pointer-events: none;
}

.drum-micro-marker {
  position: absolute;
  z-index: 2;
  top: 3px;
  bottom: 3px;
  left: var(--drum-timing-pos,50%);
  width: 2px;
  border-radius: 999px;
  background: var(--orange);
  transform: translateX(-1px);
  box-shadow: 0 0 0 1px color-mix(in srgb,var(--canvas) 45%,transparent);
  opacity: .9;
  pointer-events: none;
}

.drum-step:not(.on) .drum-vel-fill {
  display: none;
}

.drum-step:not(.timed) .drum-micro-marker {
  opacity: .24;
  background: var(--muted);
}

.drum-step-label {
  display: grid;
  place-items: center;
  color: var(--muted);
}

.drum-step.bar-start,
.drum-step-label.bar-start {
  margin-left: 3px;
}

.drum-step.on {
  background: color-mix(in srgb,var(--accent) 12%,var(--raised));
  border-color: color-mix(in srgb,var(--accent) 68%,var(--line));
  color: var(--on-accent);
}

.drum-step.playhead {
  outline: 2px solid var(--blue);
  outline-offset: 1px;
}

.drum-empty {
  padding: 28px;
  color: var(--muted);
  text-align: center;
}

.drum-timing-panel {
  flex: none;
  padding: 10px 12px 12px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb,var(--panel) 92%,var(--canvas));
}

.drum-timing-panel[hidden] {
  display: none;
}

.drum-timing-section {
  display: grid;
  grid-template-columns: 92px minmax(0,1fr);
  gap: 7px 10px;
  align-items: center;
  margin-bottom: 10px;
}

.drum-timing-section:last-child {
  margin-bottom: 0;
}

.drum-timing-section > strong {
  grid-column: 1 / -1;
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
}

.drum-timing-section > label {
  color: var(--muted);
  font-size: 12px;
}

.drum-timing-line {
  display: flex;
  gap: 6px;
  align-items: center;
  min-width: 0;
  flex-wrap: wrap;
}

.drum-timing-line input[type=number] {
  width: 72px;
}

.drum-timing-line input[type=text] {
  width: min(260px,100%);
}

.drum-swing-shape {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(72px,1fr));
  gap: 5px;
}

.drum-swing-shape label {
  display: grid;
  grid-template-columns: 22px minmax(0,1fr);
  gap: 4px;
  align-items: center;
  color: var(--muted);
  font: 10px ui-monospace,monospace;
}

.drum-swing-shape input {
  width: 100% !important;
  padding: 4px;
  font: 11px ui-monospace,monospace;
}

.drum-step.group-start,
.drum-step-label.group-start {
  margin-left: 2px;
  border-left-color: color-mix(in srgb,var(--orange) 70%,var(--line));
}

.drum-step.beat-start,
.drum-step-label.beat-start {
  border-left-color: color-mix(in srgb,var(--muted) 62%,var(--line));
}

.drum-step.timed {
  box-shadow: inset 0 -1px 0 color-mix(in srgb,var(--orange) 72%,transparent);
}

.drum-row.selected .drum-row-meta {
  border-left: 2px solid var(--accent);
  padding-left: 4px;
}

.drum-row.selected .drum-step {
  border-top-color: color-mix(in srgb,var(--accent) 38%,var(--line));
  border-bottom-color: color-mix(in srgb,var(--accent) 38%,var(--line));
}


.drum-feel-row {
  position: sticky;
  bottom: 0;
  z-index: 7;
  display: grid;
  grid-template-columns: 200px minmax(0,1fr);
  gap: 6px;
  align-items: stretch;
  margin-top: 8px;
  padding: 7px 0 4px;
  background: color-mix(in srgb,var(--canvas) 96%,var(--panel));
  border-top: 1px solid var(--line);
}

.drum-feel-meta {
  position: sticky;
  left: 0;
  z-index: 9;
  min-width: 0;
  padding: 5px 7px 4px 2px;
  background: color-mix(in srgb,var(--canvas) 96%,var(--panel));
}

.drum-feel-meta strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
}

.drum-feel-meta > span {
  display: block;
  margin: 2px 0 5px;
  color: var(--muted);
  font-size: 10px;
}

.drum-feel-values {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}

.drum-feel-values label {
  display: grid;
  grid-template-columns: auto minmax(0,1fr);
  gap: 3px;
  align-items: center;
  color: var(--muted);
  font-size: 9px;
}

.drum-feel-values input {
  width: 100%;
  min-width: 0;
  padding: 2px 3px;
  font: 10px ui-monospace,monospace;
}

.drum-feel-controls {
  min-width: max(432px, calc(var(--drum-steps) * 27px));
  display: grid;
  grid-template-rows: auto auto;
  gap: 4px;
}

.drum-feel-grid {
  display: grid;
  grid-template-columns: repeat(var(--drum-steps), minmax(27px,1fr));
  gap: 4px;
  min-width: 0;
}

.drum-feel-cell {
  position: relative;
  min-width: 27px;
  overflow: hidden;
  border: 1px solid color-mix(in srgb,var(--line) 82%,transparent);
  border-radius: max(2px,calc(var(--radius) - 1px));
  background: color-mix(in srgb,var(--canvas-deep) 76%,var(--raised));
}

.drum-feel-cell.selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent);
}

.drum-feel-cell.playhead {
  outline: 2px solid var(--blue);
  outline-offset: -2px;
}

.drum-velocity-cell {
  height: 76px;
  display: grid;
  grid-template-rows: minmax(0,1fr) 14px;
  justify-items: center;
  padding: 3px 2px 1px;
}

.drum-velocity-cell input[type=range] {
  writing-mode: vertical-lr;
  direction: rtl;
  width: 20px;
  height: 100%;
  min-height: 42px;
  padding: 0;
  accent-color: var(--accent);
  cursor: ns-resize;
}

.drum-velocity-cell output,
.drum-micro-cell output {
  display: block;
  width: 100%;
  overflow: hidden;
  text-overflow: clip;
  text-align: center;
  color: var(--muted);
  font: 9px ui-monospace,monospace;
  line-height: 13px;
  pointer-events: none;
}

.drum-length-cell { height:30px; display:grid; grid-template-rows:14px 12px; align-items:center; padding:2px 3px; }
.drum-length-cell input[type=range] { width:100%; min-width:0; height:14px; padding:0; }
.drum-length-cell output { font:9px ui-monospace,monospace; color:var(--muted); text-align:center; line-height:1; }

.drum-micro-cell {
  height: 34px;
  display: grid;
  grid-template-rows: 16px 13px;
  align-items: center;
  padding: 1px 2px;
  background:
    linear-gradient(90deg,transparent calc(50% - .5px),color-mix(in srgb,var(--orange) 42%,var(--line)) calc(50% - .5px),color-mix(in srgb,var(--orange) 42%,var(--line)) calc(50% + .5px),transparent calc(50% + .5px)),
    color-mix(in srgb,var(--canvas-deep) 76%,var(--raised));
}

.drum-micro-cell input[type=range] {
  width: 100%;
  min-width: 0;
  height: 16px;
  padding: 0;
  accent-color: var(--orange);
  cursor: ew-resize;
}

.drum-feel-row-label {
  display: none;
}

.smallbtn {
  padding: 3px 6px;
  font-size: 12px;
}

.danger {
  color: var(--red);
}

#leftTabs {
  display: flex;
  gap: 3px;
  margin-bottom: 13px;
}

#leftTabs button {
  flex: 1;
  font-size: 12px;
  padding: 5px;
}

#masterMeter {
  width: 55px;
  height: 5px;
  background: var(--canvas-deep);
  overflow: hidden;
  border-radius: 3px;
}

#masterMeter i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
}

#globalTimeline {
  height: 52px;
  position: relative;
  background: var(--canvas-deep);
  border-bottom: 1px solid var(--line);
  user-select: none;
}

#globalTimeline canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: ew-resize;
}

@media (max-width:1100px) {
  #app {
    grid-template-columns: 170px minmax(300px,1fr) 230px;
  }

  .brand {
    display: none;
  }

  #projectName {

  }

  .row input:not([type=checkbox]),

  }

@media (max-width:850px) {

  }

  #browser {
    display: none;
  }

  header {
    overflow-x: auto;
  }

  #projectName {
    display: none;
  }

  .toolbar {
    gap: 4px;
  }

  nav {
    padding: 5px;
  }

  .row label {
    min-width: 60px;
  }

  #inspector {
    padding: 10px;
  }

  .row input:not([type=checkbox]),
  .row select {
    width: 85px;
  }
}

.no-motion *,
.no-motion *::before,
.no-motion *::after {
  transition: none !important;
  animation: none !important;
  scroll-behavior: auto !important;
}

@media (max-width:620px) {
  #app {
    grid-template-columns: 1fr;
  }

  #inspector {
    display: none;
  }

  header .sep {
    display: none;
  }

  #clock {
    font-size: 15px;

  }

  .toolbar {
    height: 42px;
  }
}

:root {
  --radius: 4px;
  --font-scale: 1;
  --control-py: 5px;
  --control-px: 9px;
  --row-space: 9px;
  --control-space: 10px;
  --ui-gap: 6px;
  --shadow-ui: 0 12px 35px #0008;
  --shadow-dialog: 0 24px 90px #0009;
  --control-text: var(--text);
  --canvas: var(--bg);
  --canvas-deep: var(--bg);
  --ruler: var(--panel);
  --hover: var(--raised);
  --selected: var(--raised);
  --accent-soft: var(--raised);
  --on-accent: var(--text);
  --active-text: var(--text);
}

:root {
  font-size: calc(14px * var(--font-scale));
  font-family: system-ui,sans-serif;
  color-scheme: var(--scheme,dark);
}

body {
  background: var(--bg);
  color: var(--text);
}

button,
input,
select,
textarea {
  color: var(--control-text);
  background: var(--raised);
  border-color: var(--line);
  border-radius: var(--radius);
  padding: var(--control-py) var(--control-px);
}

button.on,
.segmented button.on {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--active-text);
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline-color: var(--accent);
}

header,
aside {
  background: var(--panel);
}

nav,
.toolbar {
  background: color-mix(in srgb,var(--panel) 94%,var(--bg));
  border-color: var(--line);
}

.viewport,
#graphView .viewport,
.velocity {
  background: var(--canvas);
}

#globalTimeline {
  background: var(--canvas-deep);
}

.item:hover,
.palette-node:hover {
  background: var(--hover);
}

.item.selected {
  background: var(--selected);
  border-color: var(--accent);
}

.row {
  margin: var(--row-space) 0;
}

.control {
  margin: var(--control-space) 0;
}

.toolbar {
  gap: var(--ui-gap);
}

input[type=range] {
  accent-color: var(--accent);
  padding: 0;
}

input[type=checkbox] {
  background: var(--canvas-deep);
  border-color: var(--line);
}

input[type=checkbox]:before {
  background: var(--muted);
}

input[type=checkbox]:checked:before {
  background: var(--on-accent);
}

.control.bipolar .control-body:before {
  background: color-mix(in srgb,var(--muted) 38%,transparent);
}

.strip {
  background: var(--panel);
  border-color: var(--line);
  border-radius: var(--radius);
}

.meter,
#masterMeter {
  background: var(--canvas-deep);
}

dialog {
  background: var(--panel);
  color: var(--text);
  border-color: var(--line);
  border-radius: calc(var(--radius) + 4px);
  box-shadow: var(--shadow-dialog);
}

dialog::backdrop {
  background: color-mix(in srgb,var(--bg) 70%,transparent);
}

.menupop {
  background: var(--panel);
  border-color: var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-ui);
}

kbd {
  background: var(--raised);
  color: var(--control-text);
}

#toast {
  background: var(--raised);
  border-color: var(--accent);
  color: var(--control-text);
  border-radius: var(--radius);
  box-shadow: var(--shadow-ui);
}

.stepgrid button {
  background: var(--raised);
}

.stepgrid button:nth-child(8n+1),
.stepgrid button:nth-child(8n+2),
.stepgrid button:nth-child(8n+3),
.stepgrid button:nth-child(8n+4) {
  background: color-mix(in srgb,var(--raised) 82%,var(--panel));
}

.stepgrid button.on {
  background: var(--accent);
  color: var(--on-accent);
}

.section,
.sub,
.tag,
.helptext,
.row label,
.control-head label,
.groove-step>span {
  color: var(--muted);
}

#clock {
  color: var(--accent);
}

.danger {
  color: var(--danger);
}

.appearance-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 10px;
  margin: 10px 0 16px;
}

.appearance-color {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 9px;
}

.appearance-color label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 7px;
}

.appearance-color .swatchrow {
  display: grid;
  grid-template-columns: 42px minmax(0,1fr);
  gap: 7px;
}

.appearance-color input[type=color] {
  width: 42px;
  height: 32px;
  padding: 2px;
}

.appearance-color input[type=text] {
  width: 100%;
  font: 12px ui-monospace,monospace;
}

.theme-presets {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 6px;
}

.theme-presets button {
  min-height: 43px;
  white-space: normal;
}

.theme-presets i {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin: 0 2px;
  vertical-align: 1px;
}

html.no-motion *,
html.no-motion *:before,
html.no-motion *:after {
  transition: none !important;
  animation: none !important;
  scroll-behavior: auto !important;
}

.settings-dialog {
  width: min(930px,96vw);
  max-width: min(930px,96vw);
}

.settings-shell {
  display: grid;
  grid-template-columns: 165px minmax(0,1fr);
  gap: 18px;
  min-height: 470px;
}

.settings-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-right: 12px;
  border-right: 1px solid var(--line);
}

.settings-nav button {
  text-align: left;
  border-color: transparent;
  background: transparent;
  padding: 8px 10px;
}

.settings-nav button.on {
  background: var(--selected);
  border-color: var(--line);
  color: var(--accent);
}

.settings-pane {
  min-width: 0;
}

.settings-pane>[data-settings-page] {
  display: none;
}

.settings-pane>[data-settings-page].active {
  display: block;
}

.settings-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

@media (max-width:620px) {
  .appearance-grid,
  .theme-presets {
    grid-template-columns: 1fr;
  }
}

@media (max-width:700px) {
  .settings-shell {
    grid-template-columns: 1fr;
    min-height: 0;
  }

  .settings-nav {
    flex-direction: row;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid var(--line);

  }

  .settings-nav button {
    flex: none;
  }

.tuning-panel {
  border: 1px solid var(--line);
  background: color-mix(in srgb,var(--panel) 78%,var(--raised));
  border-radius: calc(var(--radius) + 1px);
  padding: 9px;
  margin: 8px 0 12px;
}

.tuning-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

.tuning-head strong {
  font-size: 12px;
  letter-spacing: .04em;
}

.tuning-note-grid,
.quarter-grid,
.degree-grid {
  display: grid;
  grid-template-columns: repeat(6,minmax(0,1fr));
  gap: 4px;
}

.tuning-note-grid {
  grid-template-columns: repeat(12,minmax(0,1fr));
}

.tuning-note-grid button,
.quarter-grid button,
.degree-grid button {
  padding: 5px 2px;
  font-size: 11px;
  min-width: 0;
}

.tuning-note-grid button.on,
.quarter-grid button.on,
.degree-grid button.on {
  background: color-mix(in srgb,var(--accent) 28%,var(--raised));
  border-color: color-mix(in srgb,var(--accent) 65%,var(--line));
  color: var(--text);
}

.quarter-grid button.custom {
  box-shadow: inset 0 -2px 0 var(--orange);
}

.quarter-grid small {
  display: block;
  font-size: 9px;
  opacity: .72;
  line-height: 1.05;

.fine-tune-grid {

  grid-template-columns: repeat(3,minmax(0,1fr));

  margin-top: 7px;
}

.fine-tune-grid label {
  display: grid;
  grid-template-columns: 34px 1fr;
  align-items: center;

  color: var(--muted);
  font-size: 10px;
}

.fine-tune-grid input {
  width: 100%;
  padding: 4px;
  font-size: 11px;
}

.tuning-actions {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 7px;
}

.tuning-actions button {
  font-size: 11px;
  padding: 4px 7px;
}

.tuning-scale-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 5px;
  margin: 7px 0;
}

.tuning-scale-row select {
  width: 100%;
}

.tuning-compact .fine-tune-grid {
  grid-template-columns: repeat(2,minmax(0,1fr));
}

.tuning-compact .tuning-note-grid {
  grid-template-columns: repeat(6,minmax(0,1fr));
}

#app {
  height: calc(100vh - 108px);
}

#dialogBody .item .sub {
  display: none !important;
}

.control.discrete .control-head label:after {

#inspector:empty {

footer,
#dialogBody .item .sub,
#browser .item .sub {
  display: none !important;

.export-progress {

  padding-top: 12px;
  border-top: 1px solid var(--line);

.export-progress[hidden] {
  display: none;
}

.export-progress-head {

  gap: 10px;
  margin-bottom: 7px;
}

.export-progress-head strong {
  font-variant-numeric: tabular-nums;
}

.export-progress-track {
  height: 9px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: color-mix(in srgb, var(--canvas) 84%, var(--raised));
}

.export-progress-track > i {

.export-progress-detail {

#uiTooltip {
  position: fixed;
  z-index: 1000;
  display: none;
  max-width: 290px;
  padding: 6px 8px;
  border: 1px solid color-mix(in srgb, var(--line) 78%, var(--text));
  border-radius: max(3px, calc(var(--radius) * .75));
  background: color-mix(in srgb, var(--panel) 94%, var(--canvas));
  color: var(--text);
  box-shadow: var(--shadow-ui);
  font-size: 12px;
  line-height: 1.35;

/* Open workspace: canvas first, transient tools, independent editors. */

.drum-pad-card > .row {gap:8px!important}
.drum-pad-card > .row > :is(button,select) {flex:1 1 90px!important;width:100%;height:30px}
.drum-pad-values {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.drum-pad-values label {display:grid;gap:6px;font-size:11px;color:var(--muted);min-width:0}
.drum-pad-values input {width:100%!important;min-width:0;height:30px}
/* Regular application menus are anchored dropdowns; graph context menus stay radial. */
#dropdownMenu {width:max-content;min-width:min(248px,calc(100vw - 24px));max-width:min(340px,calc(100vw - 24px));padding:6px;border-radius:10px}
#dropdownMenu button {display:block;width:100%;min-height:32px;padding:8px 11px;border-radius:5px;text-align:left;white-space:normal;overflow-wrap:anywhere;font-size:12px;line-height:1.4;color:var(--text)}
#dropdownMenu button:hover,#dropdownMenu button:focus-visible {background:var(--raised);color:var(--accent);outline:none}
#dropdownMenu hr {margin:5px 7px;border:0;border-top:1px solid var(--line)}
#fileBtn[aria-expanded=true] {background:var(--raised);color:var(--text);border-radius:7px}

.transport-float #metroBtn {display:flex;align-items:center;justify-content:center}
.transport-float #metroBtn.on {background:var(--accent);color:var(--bg)}
.piano-meter {white-space:nowrap}
#pianoView .piano-meter input {width:43px;min-width:0;text-align:center;padding:3px}
#pianoView .piano-meter select {width:45px;min-width:0;padding:3px}
.piano-curve-strip {flex:0 0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:5px 12px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}
#pianoCurveStatus {flex:1 1 160px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.piano-curve-strip button {padding:3px 7px;min-height:25px;font-size:10px;white-space:nowrap}
.piano-grid-caption {white-space:nowrap;margin-right:5px;font-size:9px}
.piano-grid-caption b {font-weight:500;color:var(--text)}
.piano-note-fields {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}
.piano-note-fields label {display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:11px}
.piano-note-fields input,.piano-note-fields select {width:100%;min-width:0;box-sizing:border-box}
#pianoLinkEdits.on {background:color-mix(in srgb,var(--accent) 18%,var(--panel));color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
@media(max-width:1050px){.workspace-project #projectName{display:none}.workspace-brand small{display:none}.workspace-brand strong{font-size:11px;letter-spacing:1px}}
@media(max-width:780px){.workspace-brand{display:none}.transport-float{left:12px;transform:none}.transport-float #clock{display:none}}
@media(max-width:530px){.transport-float{gap:2px;padding:5px}.transport-float #playMode,.transport-float .divider{display:none}.workspace-project{right:8px;gap:0}.transport-float button{width:27px}.piano-note-fields{grid-template-columns:1fr}}

function drumDialog(n) { const pitches=Array.from({length:16},(_,i)=>36+i); showDialog('Drum pads · '+n.name, `<div class="row" style="margin-top:0"><button id="drumPadImportAsset">Import audio / SF2…</button><span class="tag">Imported assets become available to every pad.</span></div><div class="drum-pad-grid">${pitches.map(pitch=>{const pad=normalizeDrumPad(n.p.pads[pitch]??={},pitch), source=drumPadSource(pad,pitch), audio=(P.assets||[]).filter(a=>a.kind==='audio'), sf=(P.assets||[]).filter(a=>a.kind==='sf2'), sfAsset=(P.assets||[]).find(a=>a.id===pad.sfAsset), sfPresets=sfAsset?.presets||[]; return `<div class="drum-pad-card"><div class="row" style="margin:0 0 5px"><button data-pad-play="${pitch}" style="flex:1">▶ ${pitchName(pitch)}</button><select data-pad-source="${pitch}"><option value="synth" ${source==='synth'?'selected':''}>Synth</option><option value="sample" ${source==='sample'?'selected':''}>Sample</option><option value="sf2" ${source==='sf2'?'selected':''}>SoundFont</option></select></div>${source==='sample'?`<select data-pad-asset="${pitch}" style="width:100%"><option value="">Choose sample…</option>${audio.map(a=>`<option value="${a.id}" ${a.id===pad.asset?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:source==='sf2'?`<select data-pad-sf-asset="${pitch}" style="width:100%;margin-bottom:4px"><option value="">Choose SF2…</option>${sf.map(a=>`<option value="${a.id}" ${a.id===pad.sfAsset?'selected':''}>${esc(a.name)}</option>`).join('')}</select><select data-pad-sf-preset="${pitch}" style="width:100%;margin-bottom:4px">${sfPresets.map((pr,i)=>`<option value="${i}" ${i===(+pad.sfPreset||0)?'selected':''}>${esc(`${pr.bank}:${pr.program} ${pr.name}`)}</option>`).join('')||'<option value="0">Select SF2 first</option>'}</select><input data-pad-sf-key="${pitch}" type="number" min="0" max="127" step="1" value="${pad.sfKey??pitch}" style="width:100%" title="SoundFont key">`:`<select data-pad-preset="${pitch}" style="width:100%">${Object.entries(DR     $('#drumPadImportAsset').onclick=()=>{pendingDrumPadDialog=n.id;$('#assetInput').click();};
    $$('[data-pad-play]').forEach(b=>b.onclick=async()=>{await initAudio();engine.main.gain.setValueAtTime(1,engine.ctx.currentTime);const flat=engine.flat.byId.get(n.id);if(flat)engine.voice(flat,{p:+b.dataset.padPlay,v:.85,pan:0,beat:getPosition(),time:engine.ctx.currentTime+.01,duration:.5});});
    $$('[data-pad-source]').forEach(el=>el.onchange=()=>{checkpoint();const pitch=+el.dataset.padSource,pad=n.p.pads[pitch]??={};pad.source=el.value;changed(true);drumDialog(n);});

    $$('[data-pad-asset]').forEach(el=>el.onchange=()=>{checkpoint();const pad=n.p.pads[+el.dataset.padAsset]??={};pad.source='sample';pad.asset=el.value;changed(false);});
    $$('[data-pad-sf-asset]').forEach(el=>el.onchange=()=>{checkpoint();const pad=n.p.pads[+el.dataset.padSfAsset]??={};pad.source='sf2';pad.sfAsset=el.value;pad.sfPreset=0;changed(true);drumDialog(n);});
    $$('[data-pad-sf-preset]').forEach(el=>el.onchange=()=>{checkpoint();const pad=n.p.pads[+el.dataset.padSfPreset]??={};pad.source='sf2';pad.sfPreset=Math.max(0,Math.round(+el.value||0));changed(false);});
    $$('[data-pad-sf-key]').forEach(el=>el.onchange=()=>{checkpoint();const pad=n.p.pads[+el.dataset.padSfKey]??={};pad.sfKey=clamp(Math.round(+el.value||0),0,127);changed(false);});
    for(const kind of ['tune','gain']) $$('[data-pad-'+kind+']').forEach(el=>el.onchange=()=>{checkpoint();const pitch=+el.dataset['pad'+kind[0].toUpperCase()+kind.slice(1)],pad=n.p.pads[pitch]??={};pad[kind]=kind==='tune'?clamp(+el.value||0,-48,48):clamp(Number.isFinite(+el.value)?+el.value:1,0,2);changed(false);});

function helpDialog() { showDialog('Polyform · reference', `<p class="helptext">One offline HTML file. Load it directly in a desktop browser. Play unlocks audio. Projects embed their imported samples and SoundFonts.</p><div class="section">Open workspace</div><p class="helptext">File and editor buttons use dropdown menus. Radial menus are reserved for the graph context menu. The graph fills the workspace. Right-click the canvas, a node, a port or a wire for a radial action menu. Choose with the mouse or keys 1–8; Escape dismisses. Add nodes by category or use the + button. Ctrl/Cmd K searches all nodes and commands. Tab on the focused graph searches nodes. The bottom launcher toggles Piano roll, Sequencer, Arranger and Mixer windows. These editors stay open together. Drag their title bars to move; drag any edge or corner to resize; double-click a title bar to maximize or restore. Drag to the left/right edge to snap, or the top to maximize. Use the tile button or Shift F10 to tile all open windows; Alt Left/Right cycles their focus. Escape closes the focused window. Properties and assets open as independent windows from the radial menu. Layout is remembered in this browser. Piano Options reveals expression and additional drawing controls. Each editor keeps its own selected pattern. The original piano right-drag erase and drum hit context actions remain available.</p><div class="section">Workflow</div><table><tr><td>Arrange</td><td>Arrangement lanes are independent from Graph routing and extend as you scroll. Pick any Piano Roll, Step Sequencer or Drum Machine from the paint-source selector, then draw it on any lane; each clip keeps its own graph source and continues routing through the graph. Lane headers can remember a default paint source without owning or reordering graph nodes. Double-click a clip to edit its source. Shift-drag duplicates; edge-drag trims or repeats; Alt-drag slips content. Slice divides a clip. Drag the top loop strip boundaries to set the loop. The timeline inside the Arranger window can scrub the transport anywhere; drag its loop handles, or Shift-drag across it to define a loop range; global timeline loop handles snap to the nearest bar.</td></tr><tr><td>Piano roll</td><td>Draw or paint notes as pitch curves. Right-drag erases. Ctrl-drag selects. Shift-drag duplicates. Selected notes expose solid square pitch anchors and circular tangent handles. Link edits (enabled by default) applies anchor and tangent drags to the selection at matching normalized positions, preserving relative pitch and note length. Double-click insertion and removal also use the selection. Notes… edits shared velocity, pan, chance, length, transpose and mute. Curves offers midpoint insertion, smoothing, linear segments, match active curve, reverse and flatten. The Meter fields store a time signature per pattern; grid highlights group snap divisions by 2/4 or 3/6 and restart at each bar. Pattern-mode metronome accents follow this meter; song-mode metronome remains 4/4. Square pitch anchors and circular curve handles are draggable; their time positions obey Piano Snap and their pitches obey the active pitch/scale grid (Alt bypasses snap). Double-click anywhere along the note curve to insert an intermediate anchor, and double-click an intermediate anchor to remove it; start/end anchors are protected. Drag anchors or their handles to build multi-segment slides, bends and portamento. Drag note edges to resize. Alt bypasses snap. Velocity is a continuous per-note envelope: start/end velocity follows the note curve and is visualized directly as note thickness. The Expr snap selector quantizes velocity and every custom expression endpoint while dragging, using the wheel, or typing exact values. Select either square note endpoint or either endpoint in the expression lane to edit its value; while the selected endpoint is under the mouse, use the plain scroll wheel to raise/lower the currently selected expression (Velocity or custom automation) without leaving the note. Velocity is interpolated across the note. The expression selector also supports named custom per-note modulation lanes, each with its own output range and dynamic numeric port on the Piano Roll node. With Link edits enabled, expression drags and wheel edits apply relative changes to the selected notes. Turn Link edits off for individual curve or expression edits without clearing the selection.</td></tr><tr><td>Drum machine</td><td>Edit a lane-based step pattern instead of piano notes. Each row maps to a MIDI drum pitch; click a cell to toggle a hit, Shift-click to cycle velocity, Alt-click for a quick timing nudge, or right-click for exact per-hit microtiming and velocity. Steps are freely configurable from 1–128. Timing supports custom 1–32 numerators with 1/2/4/8/16/32 denominators, fractional bar counts, additive group accents such as 2+2+3, pair-swing ratios, reversible swing phase, a fully editable 1–16-step swing/groove offset cycle, per-lane timing offsets and deterministic humanize. Each drum lane also exposes a dynamic numeric timing input on the Drum machine graph node. The input is normalized to one grid step (0.10 = 10% late, -0.10 = 10% early) and is summed with the lane's stored swing/groove/microtiming before scheduling. The Groove / microtiming node exposes a matching Timing output, so its swing/custom-offset pattern can drive any individual drum lane directly; LFOs, Graph Function, Randomize and other numeric sources work too. Live timing-control edits replace only future buffered hits. Drum-machine patterns can be placed in Arrange clips, export their meter and timed hits to MIDI, and route to the same drum instrument graph as other sequencers.</td></tr><tr><td>Navigation</td><td>Arrange: wheel zooms time around the cursor; Alt-wheel scrolls vertically; Shift-wheel scrolls horizontally. Piano roll: wheel scrolls vertically; Alt-wheel zooms time around the cursor; Shift-wheel scrolls horizontally. Middle-drag pans. Global timeline: wheel zooms its time range, Shift/Alt-wheel pans, double-click fits the whole song. Graph: left-drag empty space pans; Ctrl/Cmd + left-drag empty space box-selects. Wheel zooms around the cursor; Alt-wheel pans vertically; Shift-wheel pans horizontally. Node movement snaps to the invisible grid configured in Settings → Editor (hold Shift while moving nodes to bypass snap). Zoom into a composite preview to enter it seamlessly; the parent level cross-fades away while remaining geometrically locked to the child preview, and zooming far out reverses the transition back to the parent.</td></tr><tr><td>Graph</td><td>Double-click a palette entry to add. Connect ports of the same color. Drag an existing wire to detach the end nearest your click and re-route it; right-click a wire opens its actions. Drop a port onto a compatible wire to branch or re-route automatically. Drag an entire node over a wire and release to splice it into that connection when it has a compatible input/output pair; palette-dropped nodes do the same. Right-click a port opens its disconnect action. Native browser context menus are suppressed throughout Polyform so right-click is reserved for editor actions. Deleting nodes heals compatible upstream/downstream connections where possible. Every node titlebar has a B bypass button. Bypass is a live runtime crossfade/gate: audio processors pass dry signal, event/control processors pass their input, and generators/sequencers are silenced without rebuilding the audio engine; right-click also exposes bypass. Node bodies, headers and ports react to live note/event/control/audio energy with smoothed theme-aware colour and glow. Double-click a group to inspect its graph. Group input/output nodes define the parent’s ports. Parameter nodes expose slider/toggle/button/selector controls on the parent composite and automatically output number, boolean, trigger, or enum signals. Any ordinary primitive node parameter without an existing input can be promoted to a typed input port from its inspector; the node grows or shrinks with those ports. Numeric inspector parameters use visual sliders with a linked precision-entry box; right-click any slider to customize its minimum, maximum, step/precision and linear/log response, with overrides remembered as application preferences. Small enums use segmented controls and boolean values use switches, while manual typing remains available. Composite previews are live miniature graphs and become the graph itself as you zoom in. Enable “voice” on a group to instantiate its audio primitives per note. The Graph toolbar can render the master audio behind the editor with the waveform shader. Appearance settings control wire signal displacement, raw/per-wire/shared normalization, display gain, compression, smoothing, signal detail, node geometry, outlines, shadows and activity glow. Performance settings control waveform render resolution, VSync and frame cap.</td></tr><tr><td>Routing</td><td>Orange: note events. Green: audio. Blue: numeric control. Pink: boolean. Violet: selector / enum. Coral: momentary trigger. Control inputs accept one connection and compatible control types convert automatically. Logic evaluates values; Gate, Switch, Repeat, Groove / microtiming and Arpeggiator transform note events. Randomize is an adaptive inline processor: drop it on any compatible wire and it automatically becomes audio, note-event, clock, number, boolean, enum or trigger, with type-appropriate deterministic variation controls. Groove can combine alternating swing with an editable multi-step timing pattern and a dry/wet timing mix. LFOs are beat-synchronized. Piano Roll nodes expose Velocity plus user-created per-note modulation outputs that can be wired to promoted synth/effect parameters. Per-note event expression stays attached to each voice, while numeric modulation outputs deterministically follow the most recently-started active note for shared/global targets. Graph Function is a drawable control generator with Clock and Reset inputs, looping/non-looping phase, step/linear/smooth interpolation and arbitrary numeric output range. Feedback uses Delay’s internal feedback control.</td></tr><tr><td>Instruments</td><td>Subtractive, FM and wavetable voices are editable composites, joined by Supersaw Stack, Acid Mono, Glass FM and Dream Pad presets. Their important cutoff/envelope/tone controls are implemented with Parameter property nodes inside the composite, so they appear directly on the parent synth node without opening its internals. Oscillator, noise, drum, WAV and SF2 generators expose Voice count from mono (1) up to the engine ceiling of 128. Pitched generators in mono mode add portamento time, legato/always glide modes, glide curve, high/low/last-note priority and envelope retrigger. Held notes use a standard monosynth stack: when the current key is released, priority returns to the appropriate still-held note instead of going silent. Polyphonic modes offer selectable voice stealing. In a voice composite the first note-triggered generator defines allocation for the complete voice graph, keeping FM sources and envelopes coherent. Drum Pads can use per-pad synth voices, imported audio samples, or imported SF2 preset/key assignments. Drum Machine lanes also expose individual event outputs for routing to separate instruments. WAV and SF2 assets can be imported once and reused across pads. In a custom voice group, connect note input to each source; route their audio through ADSR to the group output.</td></tr><tr><td>Arrangement</td><td>Clips reference Graph sequencers directly; Make unique creates a new graph pattern and assigns it to that clip/lane. Moving clips between arrangement lanes does not change their instrument routing—the source sequencer continues through whatever nodes it is wired to in Graph. Lanes are an independent visual/song organization layer and can remember a default paint source. Deleted graph sources leave recoverable missing-source clips that can be reassigned in Inspector. Automation lanes target numeric node parameters. Markers, tempo changes, grouping, insert time and ripple deletion are in Edit.</td></tr><tr><td>Saving</td><td>File → Save downloads a .polyform project including asset bytes. Save explicitly; browser storage is not used as the project source. Audio export renders offline with a staged progress bar; WAV stems are delivered together in an uncompressed ZIP.</td></tr></table><div class="section">Keyboard</div><table><tr><td><kbd>Space</kbd></td><td>Play / stop + return to beginning</td><td><kbd>Shift Space</kbd></td><td>Play / pause in place</td></tr><tr><td><kbd>Ctrl S / O</kbd></td><td>Save / open</td><td><kbd>Ctrl Z / Shift Z</kbd></td><td>Undo / redo</td></tr><tr><td><kbd>Ctrl A</kbd></td><td>Select all</td><td><kbd>Ctrl C / X / V</kbd></td><td>Copy / cut / paste notes, clips, or graph nodes</td></tr><tr><td><kbd>Ctrl B / D</kbd></td><td>Duplicate</td><td><kbd>Delete</kbd></td><td>Delete selection</td></tr><tr><td><kbd>Ctrl G</kbd></td><td>Group nodes</td><td><kbd>↑ ↓</kbd></td><td>Transpose semitone</td></tr><tr><td><kbd>Shift ↑ ↓</kbd></td><td>Transpose octave</td><td><kbd>← →</kbd></td><td>Move by snap step</td></tr><tr><td><kbd>Shift ← →</kbd></td><td>Resize by snap step</td><td><kbd>Ctrl Q</kbd></td><td>Quantize notes</td></tr><tr><td><kbd>Home</kbd></td><td>Rewind</td><td><kbd>F5 / F6 / F7 / F8 / F9</kbd></td><td>Arrange / focus Graph / Piano / Drums / Mixer</td></tr><tr><td><kbd>Esc</kbd></td><td>Clear selection</td><td><kbd>Z S X D C V G B H N J M</kbd></td><td>Chromatic C4–B4</td></tr><tr><td><kbd>Q 2 W 3 E R 5 T 6 Y 7 U</kbd></td><td>C5–B5</td><td><kbd>[ / ]</kbd></td><td>Keyboard octave</td></tr><tr><td><kbd>P B E C T</kbd></td><td>Draw / Paint / Select / Slice / Mute when keyboard playing is off</td><td></td><td></td></tr></table><div class="section">Real-time editing</div><p class="helptext">Most sliders and node parameters update the live Web Audio graph in place with short smoothing ramps. Clock/BPM/rate and sequencer-timing edits preserve clock phase, cancel only not-yet-started sequencer events in the lookahead window, and immediately reschedule them from the new timing state. Structural graph edits hot-swap engines while preserving currently sounding tails and replacing future sequencer events at a short safety boundary.</p><div class="section">Settings</div><p class="helptext">Open Settings with the ⚙ button, File → Settings, or Ctrl/Cmd + comma. General preferences, Web Audio sample rate/latency and scheduler timing, editor snap defaults, appearance, and GPU presentation controls are centralized there. Engine-level audio changes take effect after Restart audio engine.</p><div class="section">Appearance</div><p class="helptext">Use the ⚙ Settings button → Appearance to build the interface from three base colours: Foundation, Surface and Accent. Presets are editable; brightness, contrast, density, UI/node rounding, outline thickness, shadows, font scale, wire motion/displacement, automatic signal normalization, smoothing/compression and node activity styling can be adjusted. Text and control foregrounds automatically switch for contrast, and canvas-rendered editors use the same derived palette.</p><div class="section">Modulated clocks</div><p class="helptext">Piano roll, Drum machine and Step sequencer nodes have an optional clock input. A Clock node has its own BPM, independent of the song transport tempo. Its Rate × knob sets a base multiplier and the rate input multiplies that again: with Rate × at 1, an input of 0.5 halves the BPM and 2 doubles it; with Rate × at 2 and an input of 0.5 the effective multiplier is 1. Any numeric control such as an LFO can modulate it continuously. The Beat / Bar / Phase selector changes only the Clock node’s blue numeric value output; the violet clock output always carries the local BPM timebase used by sequencers. Live BPM/rate changes are phase-continuous and refresh already-buffered future sequencer hits without restarting currently sounding notes. Leave Clock unconnected for normal transport-synced playback.</p><div class="section">Scales & tuning</div><p class="helptext">Scale and tuning settings belong to each Piano Roll or Step Sequencer. Choose a tonic, Western scale/mode or Arabic maqam, pitch grid and Scale Snap independently per sequencer. Arabic maqam presets immediately load that sequencer’s 12-key quarter-tone cents table; the quarter-tone keys can then be overridden manually, while Fine tuning accepts exact cent offsets. Western/12-TET presets clear stale quarter-tone offsets. Existing notes are retuned non-destructively at playback. MIDI export rounds microtonal pitches to the nearest semitone.</p><div class="section">Control customization</div><p class="helptext">Continuous parameters use sliders with exact numeric entry. Right-click any slider to set its interaction minimum, maximum, step/precision and linear/log response; these profiles are application preferences. Discrete parameters use steppers, segmented buttons, switches or selectors where appropriate. Piano/step-sequencer Length remains beat-based; drum patterns use their own meter and bar length controls, including odd and compound signatures.</p><div class="section">Libraries & inspector</div><p class="helptext">The normal interface intentionally shows only control labels and editable values. Hover icon-only or otherwise unlabeled controls for concise tooltips. Node-library counts, asset metadata, inspector instructions, connection summaries and other explanatory copy are kept out of the workspace. Use this Help screen for interaction reference; node ports themselves remain the authoritative connection display.</p><div class="section">Settings storage</div><p class="helptext">Application preferences such as audio latency, scheduler behavior, editor defaults and slider profiles are stored locally in the browser. Musical project data, assets, tuning per sequencer, theme, graph rendering and visualizer configuration remain inside the .polyform project. Lower scheduler intervals can reduce control latency but increase CPU wakeups and underrun risk; browser audio-buffer size ultimately remains browser/hardware controlled.</p><div class="section">Implementation limits</div><p class="helptext">This is an original workstation with FL-inspired editing, not an exact reproduction of FL Studio. It does not implement audio time stretching independent of pitch, VST/AU plugins, MIDI hardware input, or custom SF2 modulators and modulation envelopes. Piano-roll notes support native continuous pitch curves/portamento and fractional MIDI pitches. Drum patterns show velocity as per-step fill height and stored pattern timing as horizontal markers; the selected lane has dedicated per-step velocity faders and bipolar microtiming sliders with exact numeric editing, keyboard control and live playback updates. Each Piano Roll and Step Sequencer owns its own tuning: Western scales/modes, Arabic maqam presets, 12/24/48-TET grids, a custom scale, and a 12-key Arabic-keyboard-style quarter-tone panel with per-key cent fine tuning. Different sequencers may therefore use different tunings in the same project. MIDI export currently rounds microtonal notes to the nearest semitone. SF2 supports uncompressed PCM banks, presets, zones, key/velocity splits, tuning, linked stereo, loops, volume envelopes, filter and pan; SF3 compression and ROM samples are unsupported. Audio clip transposition changes speed. Per-note velocity and named expression curves are scheduled continuously for compatible per-voice AudioParams; shared/global numeric targets follow the currently active note and are refreshed at short intervals. Microphone support depends on local-file permissions in the browser. Browser scheduling and memory limits apply; offline rendering is preferable for final audio.</p><p class="helptext">Implementation references: <a href="https://www.synthfont.com/SFSPEC21.PDF" target="_blank" rel="noreferrer">SoundFont specification</a> · <a href="https://developer.mozilla.org/en-US/docs/Web/API/MediaDevices/getUserMedia" target="_blank" rel="noreferrer">Browser audio input</a>. These links are optional; the app makes no network requests.</p>`); }

        document.body.appendChild(tip);

    let target = null, timer = null, x = 0, y = 0;
    const hide = () => {

        tip.style.display = 'none';
    };
    const place = () => {

            return;
        const pad = 12, w = tip.offsetWidth, h = tip.offsetHeight;
        let left = x + 14, top = y + 18;

            left = Math.max(pad, x - w - 14);
        if (top + h + pad > innerHeight)
            top = Math.max(pad, y - h - 12);
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
    };

        if (!text)
            return hide();
        clearTimeout(timer);

        const show = () => {

                return;
            tip.textContent = text;
            tip.style.display = 'block';

            place();
        };
        timer = setTimeout(show, immediate ? 0 : 420);

        queue(el);

        if (next && target.contains(next))
            return;
        hide();
    });

        y = e.clientY;
        place();

            return;
        const r = el.getBoundingClientRect();

        y = r.bottom;

    $('#stepProperties').onclick=()=>showProperties(n);$('#stepClear').onclick=()=>{checkpoint();n.p.steps.fill(0);refreshEditedSequencer(n);changed();};

    $('#stepLength').onchange=e=>{checkpoint();n.p.length=clamp(+e.target.value||4,.25,256);refreshEditedSequencer(n);changed();};
    $$('[data-seq-step]').forEach(b=>{const i=+b.dataset.seqStep;b.onclick=e=>{checkpoint();n.p.steps[i]=e.shiftKey?(n.p.steps[i]>=1?.25:Math.min(1,n.p.steps[i]+.25)):(n.p.steps[i]?0:.8);refreshEditedSequencer(n);changed();};b.oncontextmenu=e=>{e.preventDefault();menu(e,[0,.25,.5,.75,1].map(v=>[v?`${v*100}% velocity`:'Off',()=>{checkpoint();n.p.steps[i]=v;refreshEditedSequencer(n);changed();}]),'Step '+(i+1));};});

// Measure with the actual canvas font; character counts cannot bound proportional text.
function fitCanvasText(c, value, width, size=12) {
    const text=String(value??'').replace(/\s+/g,' ').trim();
    c.font=size+'px system-ui';

    if(c.measureText('…').width>width)return '';

    while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(c.measureText(letters.slice(0,mid).join('')+'…').width<=width)lo=mid;else hi=mid-1;}
    return letters.slice(0,lo).join('')+'…';
}
function boundedText(c,value,x,y,width,color,size=12,align='left') {

    c.beginPath();c.rect(align==='right'?x-width:x,y-size-3,Math.max(0,width),size+7);c.clip();

}

    for(let bar=Math.floor(bar0/stride)*stride;bar*m.bar<end;bar+=stride){const x=left+bar*m.bar*zoom-sx;textAt(c,String(bar+1),x+6,20,uiColor('canvasText'),11);}
    if(m.unit*zoom>=36)for(let beat=Math.ceil(start/m.unit);beat*m.unit<end;beat++){if(beat%m.num){const x=left+beat*m.unit*zoom-sx;textAt(c,String(beat%m.num+1),x+4,20,uiColor('canvasMuted'),9);}}
    c.restore();line(c,left,30,w,30,uiColor('line'));
}
function syncPianoEnhancementControls() {
    const seq=pattern(),m=pianoMeter(seq),g=pianoGridGrouping(seq);
    for(const [id,value]of [['pianoMeterNum',m.num],['pianoMeterDen',m.den]]){const el=$('#'+id);if(el&&document.activeElement!==el)el.value=value;}
    const info=$('#pianoCurveStatus');if(info)info.textContent=noteSelection.size?`${noteSelection.size} selected${noteSelection.size>1&&piano.linkEdits!==false?' · linked':''}`:'Double-click a curve to add a point';
    const grid=$('#pianoGridGrouping');if(grid){grid.textContent=`${g.first} / ${g.second}`;grid.title=`Highlight every ${g.first} and ${g.second} snap divisions; bar lines follow ${m.num}/${m.den}`;}
    for(const id of ['pianoSelectionEdit','pianoCurveMenu'])if($('#'+id))$('#'+id).disabled=!selectedPianoNotes().length;
}
function curveSelectionAction(action) {
    const notes=selectedPianoNotes();if(!notes.length)return;checkpoint();
    const lead=notes.find(n=>n.id===piano.activeCurveNote)||notes[0],source=noteCurvePath(lead);
    for(const n of notes){let path=noteCurvePath(n);
        if(action==='midpoint'){insertNoteCurveNode(n,.5);continue;}
        if(action==='match'){const delta=n.p-source[0].p;path=source.map(a=>({...a,p:clamp(a.p+delta,0,127),inP:Number.isFinite(a.inP)?clamp(a.inP+delta,0,127):undefined,outP:Number.isFinite(a.outP)?clamp(a.outP+delta,0,127):undefined}));}
        if(action==='flat')path=[{t:0,p:n.p,outT:1/3,outP:n.p},{t:1,p:n.p,inT:2/3,inP:n.p}];
        if(action==='linear'||action==='smooth'){
            for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1],dt=(b.t-a.t)/3;a.outT=a.t+dt;b.inT=b.t-dt;a.outP=action==='smooth'?a.p:a.p+(b.p-a.p)/3;b.inP=action==='smooth'?b.p:a.p+(b.p-a.p)*2/3;}
        }
        if(action==='reverse')path=path.slice().reverse().map(a=>({t:1-a.t,p:a.p,inT:Number.isFinite(a.outT)?1-a.outT:undefined,inP:a.outP,outT:Number.isFinite(a.inT)?1-a.inT:undefined,outP:a.inP}));
        syncNoteCurvePath(n,path);
    }
    refreshEditedSequencer(pattern());changed(false);renderInspector();drawAll();
}
function pianoSelectionDialog() {
    const seq=pattern(),notes=selectedPianoNotes(seq);if(!notes.length)return;
    const specs=[['v','Start velocity',0,1,.01],['ve','End velocity',0,1,.01],['pan','Pan',-1,1,.01],['prob','Chance',0,1,.01],['d','Length (beats)',.015625,1024,.015625],['transpose','Transpose (semitones)',-127,127,.01]];
    const value=(n,k)=>k==='v'?noteVelocityEndpoints(n).a:k==='ve'?noteVelocityEndpoints(n).b:k==='transpose'?0:n[k]??(k==='prob'?1:0);
    showDialog(`Edit ${notes.length} ${notes.length===1?'note':'notes'}`,`<p class="helptext">Changed fields apply to every selected note. Leave mixed fields blank to keep their individual values.</p><div class="piano-note-fields">${specs.map(([k,label,min,max,step])=>{const values=notes.map(n=>value(n,k)),same=values.every(v=>Math.abs(v-values[0])<1e-7);return `<label>${label}<input data-batch-note="${k}" type="number" min="${min}" max="${max}" step="${step}" value="${same?values[0]:''}" placeholder="Mixed"></label>`;}).join('')}<label>Mute<select id="batchNoteMute"><option value="">Keep current</option><option value="on">Muted</option><option value="off">Unmuted</option></select></label></div><div class="row"><span class="grow"></span><button id="applyBatchNotes">Apply to ${notes.length} ${notes.length===1?'note':'notes'}</button></div>`);
    const touched=new Set();$$('[data-batch-note]').forEach(el=>el.oninput=()=>touched.add(el.dataset.batchNote));
    $('#applyBatchNotes').onclick=()=>{
        const edits=[];for(const el of $$('[data-batch-note]')){if(!touched.has(el.dataset.batchNote)||el.value==='')continue;if(!Number.isFinite(+el.value)||+el.value<+el.min||+el.value>+el.max){el.focus();toast('Enter a value within the displayed range.');return;}edits.push([el.dataset.batchNote,+el.value]);}
        const mute=$('#batchNoteMute').value;if(!edits.length&&!mute){$('#dialog').close();return;}checkpoint();
        for(const [key,v]of edits){
            if(key==='transpose'){const pitches=notes.flatMap(noteCurvePitchValues),delta=clamp(v,-Math.min(...pitches),127-Math.max(...pitches));notes.forEach(n=>shiftNoteCurve(n,delta));}
            else for(const n of notes)n[key]=v;
        }
        if(mute)notes.forEach(n=>n.mute=mute==='on');
        extendPattern();refreshEditedSequencer(seq);$('#dialog').close();changed(false);renderInspector();drawAll();
    };
}
function initPianoEnhancements() {
    piano.linkEdits=true;
    const bar=$('#pianoView > .toolbar');
    bar.insertAdjacentHTML('beforeend','<label class="piano-meter" title="Pattern time signature; length stays in quarter-note beats">Meter <input id="pianoMeterNum" aria-label="Time signature numerator" type="number" min="1" max="32" step="1" value="4"><span>/</span><select id="pianoMeterDen" aria-label="Time signature denominator"><option>1</option><option>2</option><option selected>4</option><option>8</option><option>16</option><option>32</option></select></label><button id="pianoLinkEdits" class="on" aria-pressed="true" title="Edit selected notes together; turn off to edit one curve within the selection">Link edits</button>');
    const strip=document.createElement('div');strip.className='piano-curve-strip';strip.innerHTML='<span id="pianoCurveStatus"></span><span class="piano-grid-caption">Grid <b id="pianoGridGrouping"></b></span><button id="pianoSelectionEdit">Notes…</button><button id="pianoCurveMenu" aria-haspopup="menu">Curves ▾</button>';
    $('#pianoView').insertBefore(strip,$('#pianoOptions'));
    const setMeter=()=>{const seq=windowPattern('piano');if(!seq)return;const num=+$('#pianoMeterNum').value;if(!Number.isInteger(num)||num<1||num>32){withWindowPattern('piano',syncPianoEnhancementControls);return;}checkpoint();seq.p.timeSignature={numerator:num,denominator:+$('#pianoMeterDen').value};dirty=true;drawPiano();};
    $('#pianoMeterNum').onchange=setMeter;$('#pianoMeterDen').onchange=setMeter;
    $('#pianoLinkEdits').onclick=e=>{piano.linkEdits=!piano.linkEdits;e.currentTarget.classList.toggle('on',piano.linkEdits);e.currentTarget.setAttribute('aria-pressed',String(piano.linkEdits));drawPiano();};
    $('#pianoSelectionEdit').onclick=()=>{focusWorkspacePane('piano');pianoSelectionDialog();};
    $('#pianoCurveMenu').onclick=e=>{focusWorkspacePane('piano');menu(e,[['Add midpoint',()=>curveSelectionAction('midpoint')],['Smooth bends',()=>curveSelectionAction('smooth')],['Linear segments',()=>curveSelectionAction('linear')],['Match active curve',()=>curveSelectionAction('match')],['Reverse curves',()=>curveSelectionAction('reverse')],null,['Flatten curves',()=>curveSelectionAction('flat')]],'Note curves');};
    const pc=$('#pianoCanvas'),vc=$('#velocityCanvas');pc.ondblclick=editCurveDoubleClick;
    pc.title='Double-click a curve: add anchor · Double-click an anchor: remove · Drag squares: anchors · Drag circles: tangents · Ctrl-drag: select · Alt: free movement';
    vc.title='Drag an endpoint to edit expression. Linked edits preserve offsets across selected notes.';
    vc.onpointerdown=e=>{
        if(e.button!==0)return;const target=expressionTargetAt(e);if(!target)return;
        checkpoint();if(!noteSelection.has(target.note.id))noteSelection=new Set([target.note.id]);piano.noteAnchor=target.end;
        const key=piano.velocity,value=n=>{const ep=noteExpressionEndpoints(pattern(),n,key);return target.end==='end'?ep.b:ep.a;};
        drag={kind:'velocity',exprNoteId:target.note.id,exprEnd:target.end,exprStart:value(target.note),exprSaved:linkedPianoNotes(target.note).map(n=>({id:n.id,value:value(n)}))};
        vc.setPointerCapture(e.pointerId);editVelocity(e);
    };
    const cancel=e=>{if(['noteCurve','velocity'].includes(drag?.kind)){refreshEditedSequencer(pattern());drag=null;dirty=true;pc.style.cursor='default';drawAll();}};
    pc.addEventListener('pointercancel',cancel);vc.addEventListener('pointercancel',cancel);
    const oldSnap=$('#pianoSnap').onchange;$('#pianoSnap').onchange=e=>{oldSnap?.(e);drawPiano();};
    const metro=$('#metroBtn');metro.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 3h6l4 18H5L9 3Z M12 17l6-12 M9 17h6"/><circle cx="16.5" cy="8" r="1.5" fill="currentColor"/></svg>';
    metro.setAttribute('aria-label','Metronome');metro.setAttribute('aria-pressed',String(transport.metro));metro.title='Metronome';
    const toggle=metro.onclick;metro.onclick=()=>{toggle();metro.setAttribute('aria-pressed',String(transport.metro));};
    withWindowPattern('piano',syncPianoEnhancementControls);
}
