<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Projects</title>
  <meta name="description" content="A searchable homepage for HTML projects." />

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: #121722;
      --panel-2: #171d29;
      --text: #f3f5f7;
      --muted: #9aa4b2;
      --border: rgba(255,255,255,.09);
      --shadow: 0 18px 50px rgba(0,0,0,.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(73, 100, 255, .12), transparent 28rem),
        radial-gradient(circle at 90% 10%, rgba(159, 82, 255, .10), transparent 28rem),
        var(--bg);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    header {
      display: flex;
      gap: 24px;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .title-wrap {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: .98rem;
    }

    .count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: .9rem;
      padding-bottom: 2px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 0;
      margin: 0 0 20px;
      backdrop-filter: blur(16px);
      background: linear-gradient(to bottom, rgba(11,13,18,.92), rgba(11,13,18,.70), transparent);
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18,23,34,.90);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 14px;
      box-shadow: var(--shadow);
    }

    .search svg {
      width: 18px;
      height: 18px;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      padding: 14px 0;
      font: inherit;
    }

    .search input::placeholder {
      color: #7d8795;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--panel-2);
      border-color: rgba(255,255,255,.16);
    }

    .preview {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
      border-bottom: 1px solid var(--border);
    }

    .preview iframe {
      position: absolute;
      inset: 0;
      width: 1280px;
      height: 800px;
      border: 0;
      transform: scale(.25);
      transform-origin: 0 0;
      pointer-events: none;
      background: white;
    }

    .preview-fallback {
      display: grid;
      place-items: center;
      position: absolute;
      inset: 0;
      color: var(--muted);
      font-size: .9rem;
      text-align: center;
      padding: 20px;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 16px 16px;
    }

    .project-name {
      min-width: 0;
      font-weight: 700;
      letter-spacing: -.01em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .open-icon {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      color: var(--muted);
    }

    .state {
      grid-column: 1 / -1;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .state strong {
      color: var(--text);
    }

    code {
      color: #dbe2ff;
      background: rgba(255,255,255,.06);
      border-radius: 6px;
      padding: 2px 5px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 20px, 1200px);
        padding-top: 30px;
      }

      header {
        align-items: start;
        flex-direction: column;
        gap: 10px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .preview iframe {
        transform: scale(.27);
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <header>
      <div class="title-wrap">
        <h1>My Projects</h1>
        <p class="subtitle">Browse, search, and open any project.</p>
      </div>
      <div class="count" id="count">Loading projects…</div>
    </header>

    <div class="toolbar">
      <label class="search" aria-label="Search projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input
          id="search"
          type="search"
          placeholder="Search projects…"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
    </div>

    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <script>
    const PROJECTS_DIR = "./projects/";
    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("search");
    const countEl = document.getElementById("count");

    let allProjects = [];

    function displayName(fileName) {
      return decodeURIComponent(fileName)
        .replace(/\.html?$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function createCard(project) {
      const link = document.createElement("a");
      link.className = "card";
      link.href = project.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.dataset.name = project.name.toLowerCase();
      link.title = `Open ${project.name} in a new tab`;

      const preview = document.createElement("div");
      preview.className = "preview";

      const fallback = document.createElement("div");
      fallback.className = "preview-fallback";
      fallback.textContent = "Preview unavailable";

      const iframe = document.createElement("iframe");
      iframe.src = project.url;
      iframe.loading = "lazy";
      iframe.tabIndex = -1;
      iframe.setAttribute("aria-hidden", "true");

      iframe.addEventListener("load", () => {
        fallback.remove();
      });

      iframe.addEventListener("error", () => {
        iframe.remove();
      });

      preview.append(fallback, iframe);

      const meta = document.createElement("div");
      meta.className = "meta";

      const name = document.createElement("div");
      name.className = "project-name";
      name.textContent = project.name;

      const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      icon.setAttribute("viewBox", "0 0 24 24");
      icon.setAttribute("fill", "none");
      icon.setAttribute("stroke", "currentColor");
      icon.setAttribute("stroke-width", "2");
      icon.setAttribute("class", "open-icon");
      icon.setAttribute("aria-hidden", "true");
      icon.innerHTML = `
        <path d="M14 3h7v7"></path>
        <path d="M10 14 21 3"></path>
        <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path>
      `;

      meta.append(name, icon);
      link.append(preview, meta);
      return link;
    }

    function render(projects) {
      grid.innerHTML = "";

      if (!projects.length) {
        const empty = document.createElement("div");
        empty.className = "state";
        empty.textContent = "No matching projects found.";
        grid.append(empty);
      } else {
        const fragment = document.createDocumentFragment();
        projects.forEach(project => fragment.append(createCard(project)));
        grid.append(fragment);
      }

      countEl.textContent =
        `${projects.length} project${projects.length === 1 ? "" : "s"}`;
    }

    function filterProjects() {
      const query = searchInput.value.trim().toLowerCase();

      if (!query) {
        render(allProjects);
        return;
      }

      render(
        allProjects.filter(project =>
          project.name.toLowerCase().includes(query) ||
          project.file.toLowerCase().includes(query)
        )
      );
    }

    async function loadProjectsFromDirectoryListing() {
      const response = await fetch(PROJECTS_DIR, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(`Could not open ${PROJECTS_DIR}`);
      }

      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, "text/html");

      const files = [...doc.querySelectorAll("a[href]")]
        .map(a => a.getAttribute("href"))
        .filter(Boolean)
        .map(href => {
          try {
            return new URL(href, new URL(PROJECTS_DIR, location.href));
          } catch {
            return null;
          }
        })
        .filter(Boolean)
        .filter(url => /^https?:$/.test(url.protocol))
        .filter(url => {
          const path = decodeURIComponent(url.pathname);
          return /\.html?$/i.test(path) && !path.endsWith("/index.html");
        })
        .filter(url => url.origin === location.origin)
        .map(url => {
          const file = decodeURIComponent(url.pathname.split("/").pop());
          return {
            file,
            name: displayName(file),
            url: url.href
          };
        });

      const unique = new Map();
      files.forEach(project => unique.set(project.url, project));

      return [...unique.values()]
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    async function init() {
      try {
        allProjects = await loadProjectsFromDirectoryListing();

        if (!allProjects.length) {
          throw new Error("No HTML files were found in the directory listing.");
        }

        render(allProjects);
      } catch (error) {
        console.error(error);

        countEl.textContent = "Could not load projects";
        grid.innerHTML = `
          <div class="state">
            <strong>The browser could not automatically list the files in <code>projects/</code>.</strong>
            <br><br>
            This page must be served through a web server that provides a directory listing.
            For example, from the folder containing this file, run:
            <br><br>
            <code>python -m http.server 8000</code>
            <br><br>
            Then open <code>http://localhost:8000/</code>.
          </div>
        `;
      }
    }

    searchInput.addEventListener("input", filterProjects);
    init();
  </script>
</body>
</html>
